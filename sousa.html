<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Image Viewer</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    #image-container img {
      max-width: 80%;
      height: auto;
      margin-top: 20px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    #controls {
      margin-top: 20px;
    }

    #controls img {
      width: 75px; /* Adjust size of your button images */
      cursor: pointer;
      transition: transform 0.2s;
      display: inline;
    }

    #controls img:hover {
      transform: scale(1.1);
    }
      
    #back-btn{
      scale: 55%;
      padding : 0px;
      margin : 0px;
    }
      
    #next-btn{
      scale: 55%;
      padding : 0px;
      margin : 0px;
    }
      
    #exit-btn{
      scale: 55%; 
      padding : -21px;
      margin : 0px;
    }
  </style>
</head>
<body>
  <div id="image-container">
    <img id="main-image" src="icon/image1.png" alt="Image">
  </div>

  <div id="controls">
    <img id="back-btn" src="icon/back.png" alt="Back" onclick="goBack()" style="display:none;">
    <img id="exit-btn" src="icon/returnbtn.png" alt="Exit" onclick="exitViewer()" style="display:none;">
    <img id="next-btn" src="icon/next.png" alt="Next" onclick="goNext()" style="display:none;">
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const selectedModelUrl = urlParams.get('model');

    const images = ["icon/image1.png", "icon/image2.png", "icon/image3.png"];
    let currentIndex = 0;

    const mainImage = document.getElementById("main-image");
    const backBtn = document.getElementById("back-btn");
    const nextBtn = document.getElementById("next-btn");
    const exitBtn = document.getElementById("exit-btn");

    function updateImage() {
      mainImage.src = images[currentIndex];
      updateButtons();
    }

    function updateButtons() {
      backBtn.style.display = "none";
      nextBtn.style.display = "none";
      exitBtn.style.display = "none";

      if (currentIndex === 0) {
        nextBtn.style.display = "inline-block";
        exitBtn.style.display = "inline-block";
      } else if (currentIndex === 1) {
        backBtn.style.display = "inline-block";
        nextBtn.style.display = "inline-block";
        exitBtn.style.display = "inline-block";
      } else if (currentIndex === 2) {
        backBtn.style.display = "inline-block";
        exitBtn.style.display = "inline-block";
      }
    }

    function goNext() {
      if (currentIndex < images.length - 1) {
        currentIndex++;
        updateImage();
      }
    }

    function goBack() {
      if (currentIndex > 0) {
        currentIndex--;
        updateImage();
      }
    }

    function exitViewer() {
      // ✅ Return to the model-viewer page with the same model
      if (selectedModelUrl) {
        window.location.href = `model-viewer.html?model=${encodeURIComponent(selectedModelUrl)}`;
      } else {
        alert("Model URL not found!");
        window.location.href = 'model-viewer.html';
      }
    }

    updateImage();
  </script>
</body>
</html>
